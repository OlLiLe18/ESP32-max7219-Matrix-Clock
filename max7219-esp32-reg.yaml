################################################################################
#  MAX7219 ESP32 matrix display (12-module chain = 96x8 pixels)
#  - Date display: every minute at seconds 50 to 55 with a 📅 icon
#  - Colon: original double drawing at X=21 & X=22 (bold & bright)
#  - Icons: high-contrast 8x8 retro & expressive graphics at X=87
#  - Brightness: applies Home Assistant changes on the next 50 ms frame
#  - Framework: Arduino
################################################################################

esphome:
  name: max7219-esp32-reg
  friendly_name: MAX7219-ESP32-REG

esp32:
  board: esp32dev
  framework:
    type: arduino

web_server:
  port: 80

logger:
  level: INFO

################################################################################
#  Scheduling: night mode
################################################################################
datetime:
  - platform: template
    name: "Night Mode Start"
    id: night_mode_start
    type: time
    optimistic: true
    initial_value: "22:00:00"
    restore_value: true

  - platform: template
    name: "Night Mode End"
    id: night_mode_end
    type: time
    optimistic: true
    initial_value: "07:00:00"
    restore_value: true

################################################################################
#  Global variables
################################################################################
globals:
  # Time synchronisation successful?
  - id: time_sync_done
    type: bool
    restore_value: true
    initial_value: 'false'

  # Frame counter for smooth animation at 20 FPS
  - id: anim_frame
    type: uint32_t
    initial_value: '0'

  # Scrolling text position
  - id: text_anim_pos
    type: int
    initial_value: '0'

  # Bounce direction
  - id: text_anim_dir
    type: int
    initial_value: '1'

  # Current icon design (0 to 6)
  - id: active_smiley
    type: int
    initial_value: '0'

  # Two-frame animation toggle (heartbeat, Pac-Man, etc.)
  - id: icon_anim_phase
    type: bool
    initial_value: 'false'

  # Stores the brightness currently applied to the hardware
  - id: current_applied_intensity
    type: int
    initial_value: '-1'

################################################################################
#  Selection menus
################################################################################
select:
  - platform: template
    name: "Text Animation"
    id: text_animation
    options:
      - "Scroll"
      - "Bounce"
      - "Wipe"
      - "Static"
    initial_option: "Scroll"
    optimistic: true
    restore_value: true

  - platform: template
    name: "Display Page"
    id: display_page
    options:
      - "Clock"
      - "Text"
    initial_option: "Clock"
    optimistic: true
    restore_value: true

################################################################################
#  Time synchronisation (SNTP)
################################################################################
time:
  - platform: sntp
    id: sntp_time
    timezone: "Europe/Berlin"
    on_time_sync:
      then:
        lambda: |-
          id(time_sync_done) = true;

################################################################################
#  Text input
################################################################################
text:
  - platform: template
    name: "Display Text"
    id: display_text
    optimistic: true
    initial_value: "ESPHome rocks! Matrix 96x8"
    min_length: 0
    max_length: 64
    mode: text
    restore_value: true
    on_value:
      then:
        lambda: |-
          id(text_anim_pos) = 0;
          id(text_anim_dir) = 1;

################################################################################
#  Brightness control (levels 0 to 15), applied by the display lambda
################################################################################
number:
  - platform: template
    name: "Display Brightness"
    id: display_brightness
    min_value: 0
    max_value: 15
    step: 1
    initial_value: 3
    optimistic: true
    restore_value: true

  - platform: template
    name: "Night Mode Brightness"
    id: night_brightness
    min_value: 0
    max_value: 15
    step: 1
    initial_value: 0
    optimistic: true
    restore_value: true

################################################################################
#  Switches
################################################################################
switch:
  - platform: template
    name: "Display Power"
    id: display_power
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

  - platform: template
    name: "Night Mode Active"
    id: night_mode_enabled
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

  - platform: template
    name: "Show Date Every Minute"
    id: show_date_enabled
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

################################################################################
#  Fonts (/config/esphome/fonts/)
################################################################################
font:
  - file: "fonts/basis33.ttf"
    id: digit_font_basis
    size: 16
    glyphs: "0123456789: "

  - file: "fonts/basis33.ttf"
    id: digit_font_basis15
    size: 16
    glyphs: "0123456789: "

  - file: "fonts/pixelmix.ttf"
    id: font_pixelmix
    size: 8
    glyphs: "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyzÄÖÜäöüß0123456789!#$%&'()*+,-./:;<=>?@[]^_{|}° "

################################################################################
#  Home Assistant temperature sensor
################################################################################
sensor:
  - platform: homeassistant
    id: temp_sensor
    entity_id: sensor.aussenthermometer_temperature

################################################################################
#  Intervals
################################################################################
interval:
  # Choose a new design every 12 seconds
  - interval: 12s
    then:
      lambda: |-
        id(active_smiley) = random() % 7;

  # Toggle the animation phase every 500 ms (e.g. heartbeat / Pac-Man chewing)
  - interval: 500ms
    then:
      lambda: |-
        id(icon_anim_phase) = !id(icon_anim_phase);

################################################################################
#  SPI connection
################################################################################
spi:
  clk_pin: GPIO26
  mosi_pin: GPIO27

################################################################################
#  Display: 12 modules (96x8) rendered at 20 FPS
################################################################################
display:
  - platform: max7219digit
    id: max_display
    cs_pin: GPIO25
    num_chips: 12
    intensity: 3
    # Animations are handled by the lambda; disable driver auto-scrolling.
    scroll_enable: false
    update_interval: 50ms

    lambda: |-
      id(anim_frame)++;

      // 1. NIGHT MODE & POWER CONTROL
      bool is_night = false;
      auto now = id(sntp_time).now();

      if (id(night_mode_enabled).state && id(time_sync_done) && now.is_valid()) {
        auto start = id(night_mode_start).state_as_esptime();
        auto end = id(night_mode_end).state_as_esptime();
        int cur_min = now.hour * 60 + now.minute;
        int s_min = start.hour * 60 + start.minute;
        int e_min = end.hour * 60 + end.minute;

        is_night = (s_min > e_min)
          ? (cur_min >= s_min || cur_min < e_min)
          : (cur_min >= s_min && cur_min < e_min);
      }

      // Display OFF: clear the buffer & set intensity to 0
      if (!id(display_power).state || (is_night && (int)id(night_brightness).state == 0)) {
        if (id(current_applied_intensity) != 0) {
          it.intensity(0);
          id(current_applied_intensity) = 0;
        }
        it.fill(COLOR_OFF);
        return;
      }

      // Calculate the target brightness
      int target_brightness = is_night ? (int)id(night_brightness).state : (int)id(display_brightness).state;
      
      // Send over SPI only when the brightness has changed!
      if (id(current_applied_intensity) != target_brightness) {
        it.intensity(target_brightness);
        id(current_applied_intensity) = target_brightness;
      }

      const int W = it.get_width();   // 96 pixels
      const int H = it.get_height();  // 8 pixels

      // =======================================================================
      // 2. TEXT PAGE
      // =======================================================================
      if (id(display_page).current_option() == "Text") {
        const char* text_str = id(display_text).state.c_str();
        if (text_str[0] == '\0') {
          it.print(W / 2, 0, id(font_pixelmix), TextAlign::TOP_CENTER, "-");
          return;
        }

        int x1, y1, w, h;
        it.get_text_bounds(0, 0, text_str, id(font_pixelmix), TextAlign::TOP_LEFT, &x1, &y1, &w, &h);

        if (w <= W) {
          it.print(W / 2, 0, id(font_pixelmix), TextAlign::TOP_CENTER, text_str);
          return;
        }

        auto mode = id(text_animation).current_option();

        if (mode == "Scroll") {
          if (id(anim_frame) % 2 == 0) {
            id(text_anim_pos)++;
            if (id(text_anim_pos) > (w + W)) {
              id(text_anim_pos) = 0;
            }
          }
          int render_x = W - id(text_anim_pos);
          it.print(render_x, 0, id(font_pixelmix), text_str);

        } else if (mode == "Bounce") {
          int max_offset = w - W + 6;
          if (id(anim_frame) % 2 == 0) {
            id(text_anim_pos) += id(text_anim_dir);
            if (id(text_anim_pos) >= max_offset) {
              id(text_anim_pos) = max_offset;
              id(text_anim_dir) = -1;
            } else if (id(text_anim_pos) <= 0) {
              id(text_anim_pos) = 0;
              id(text_anim_dir) = 1;
            }
          }
          it.print(-id(text_anim_pos) + 2, 0, id(font_pixelmix), text_str);

        } else if (mode == "Wipe") {
          int max_step = W + w;
          if (id(anim_frame) % 2 == 0) {
            id(text_anim_pos) = (id(text_anim_pos) + 1) % max_step;
          }
          int render_x = W - id(text_anim_pos);
          it.print(render_x, 0, id(font_pixelmix), text_str);

        } else {
          it.print(0, 0, id(font_pixelmix), text_str);
        }
        return;
      }

      // =======================================================================
      // 3. TIME & STATUS PAGE (CLOCK)
      // =======================================================================
      if (!id(time_sync_done) || !now.is_valid()) {
        it.print(W / 2, 0, id(font_pixelmix), TextAlign::TOP_CENTER, "SYNC...");
        return;
      }

      // Show the date every minute at seconds :50 to :55
      bool show_date = id(show_date_enabled).state && (now.second >= 50 && now.second <= 55);

      if (show_date) {
        // 3.A DATE DISPLAY (e.g. "SO 23.08.", using German weekday abbreviations)
        static const char* const WAYS[7] = { "SO", "MO", "DI", "MI", "DO", "FR", "SA" };
        int wday_idx = (now.day_of_week - 1 + 7) % 7;

        it.printf(4, 0, id(font_pixelmix), TextAlign::TOP_LEFT, "%s %02d.%02d.", WAYS[wday_idx], now.day_of_month, now.month);

        // Animated calendar icon 📅 at the far right, X=87
        static const uint8_t CAL_ICON[2][8] = {
          { 0b01100110, 0b11111111, 0b10000001, 0b10111101, 0b10111101, 0b10111101, 0b10000001, 0b11111111 },
          { 0b01100110, 0b11111111, 0b10000001, 0b10000001, 0b10111101, 0b10111101, 0b10000001, 0b11111111 }
        };
        const uint8_t* c_pat = CAL_ICON[id(icon_anim_phase) ? 1 : 0];
        int start_x = 87;
        for (int r = 0; r < 8; r++) {
          for (int c = 0; c < 8; c++) {
            if (c_pat[r] & (1 << (7 - c))) it.draw_pixel_at(start_x + c, r, COLOR_ON);
          }
        }
      } else {
        // 3.B NORMAL TIME DISPLAY: hours at X=8, minutes at X=28
        it.printf(8, 5, id(digit_font_basis), TextAlign::CENTER_LEFT, "%02d", now.hour);
        it.printf(28, 5, id(digit_font_basis), TextAlign::CENTER_LEFT, "%02d", now.minute);

        // Draw the colon twice at X=21 and X=22 for a bold appearance
        if (now.second % 2 == 1) {
          it.print(21, -4, id(digit_font_basis15), ":");
          it.print(22, -4, id(digit_font_basis15), ":");
        }

        // Temperature at X=64
        if (id(temp_sensor).has_state() && std::isfinite(id(temp_sensor).state)) {
          it.printf(64, 0, id(font_pixelmix), TextAlign::TOP_CENTER, "%.1f°", id(temp_sensor).state);
        } else {
          it.print(64, 0, id(font_pixelmix), TextAlign::TOP_CENTER, "--.-°");
        }

        // 8x8 expressive icons at the far right (X=87 to 94)
        static const uint8_t ICONS[7][2][8] = {
          // 0: Anime eyes (^  ^)
          {
            { 0b00000000, 0b01100110, 0b10011001, 0b00000000, 0b10000001, 0b01000010, 0b00111100, 0b00000000 },
            { 0b00000000, 0b00000000, 0b11111111, 0b00000000, 0b10000001, 0b01111110, 0b00111100, 0b00000000 }
          },
          // 1: Pulsing heart
          {
            { 0b01100110, 0b11111111, 0b11111111, 0b11111111, 0b01111110, 0b00111100, 0b00011000, 0b00000000 },
            { 0b00000000, 0b01100110, 0b01111110, 0b00111100, 0b00011000, 0b00000000, 0b00000000, 0b00000000 }
          },
          // 2: Retro Pac-Man
          {
            { 0b00111100, 0b01111110, 0b11110000, 0b11100000, 0b11110000, 0b01111110, 0b00111100, 0b00000000 },
            { 0b00111100, 0b01111110, 0b11111110, 0b11111111, 0b11111110, 0b01111110, 0b00111100, 0b00000000 }
          },
          // 3: Space Invader Alien
          {
            { 0b00011000, 0b00111100, 0b01111110, 0b11011011, 0b11111111, 0b00100100, 0b01011010, 0b10100101 },
            { 0b00011000, 0b00111100, 0b01111110, 0b11011011, 0b11111111, 0b01011010, 0b10000001, 0b01000010 }
          },
          // 4: Cool sunglasses
          {
            { 0b00000000, 0b11111111, 0b11101110, 0b11001100, 0b01100110, 0b00000000, 0b01111110, 0b00000000 },
            { 0b00000000, 0b11111111, 0b11101110, 0b11001100, 0b01100110, 0b00000000, 0b00111100, 0b00000000 }
          },
          // 5: Steaming coffee cup
          {
            { 0b00100100, 0b01001000, 0b00100100, 0b11111100, 0b10000110, 0b10000110, 0b01111100, 0b00111000 },
            { 0b01001000, 0b00100100, 0b01001000, 0b11111100, 0b10000110, 0b10000110, 0b01111100, 0b00111000 }
          },
          // 6: Shining sun
          {
            { 0b00100100, 0b10000001, 0b00111100, 0b01111110, 0b01111110, 0b00111100, 0b10000001, 0b00100100 },
            { 0b00011000, 0b01000010, 0b00111100, 0b10111101, 0b10111101, 0b00111100, 0b01000010, 0b00011000 }
          }
        };

        int icon_idx = id(active_smiley) % 7;
        int phase = id(icon_anim_phase) ? 1 : 0;
        const uint8_t* pattern = ICONS[icon_idx][phase];

        int start_x = 87;

        for (int row = 0; row < 8; row++) {
          uint8_t line = pattern[row];
          for (int col = 0; col < 8; col++) {
            if (line & (1 << (7 - col))) {
              it.draw_pixel_at(start_x + col, row, COLOR_ON);
            }
          }
        }
      }

############################################################
#  API + OTA + Wi-Fi
############################################################
api:
  encryption:
    # Unique API key stored in secrets.yaml
    key: !secret api_encryption_key

ota:
  - platform: esphome
    # OTA password stored in secrets.yaml
    password: !secret ota_password


wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable the fallback hotspot (captive portal) if the Wi-Fi connection fails
  ap:
    ssid: "Max7219-Esp32-Reg"
    # Choose a secure password
    password: !secret fallback_ap_password

captive_portal:
