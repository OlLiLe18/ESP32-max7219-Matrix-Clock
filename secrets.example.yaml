# Home Assistant API aktivieren
api:
  encryption:
    #secret anpassen/prüfen
    key: "DEIN_API_KEY"

ota:
  - platform: esphome
    #secret anpassen/prüfen
    password: "DEIN_OTA_PASSWORT"


wifi:
  ssid: "DEIN_WLAN_NAME"
  password: "DEIN_WLAN_PASSWORT"

# Aktiviere den Fallback-Hotspot (Captive Portal), falls die WLAN-Verbindung fehlschlägt
  ap:
    ssid: "Max7219-Esp32-Reg"
    #gerne ein sicheres Passwort wählen
    password: "du bist Bereit"

# Aktiviert den lokalen Webserver auf dem Gerät
web_server:
  port: 80

# Ermöglicht die Einrichtung per Bluetooth direkt im Browser (z.B. Chrome)
esp32_improv:
  authorizer: none

# Startet das Notfall-WLAN, falls die Verbindung fehlschlägt.
captive_portal: