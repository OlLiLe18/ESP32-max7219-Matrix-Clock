api:
  encryption:
    # Check or replace the credential
    key: "DEIN_API_KEY"

ota:
  - platform: esphome
    # Check or replace the credential
    password: "DEIN_OTA_PASSWORT"


wifi:
  ssid: "DEIN_WLAN_NAME"
  password: "DEIN_WLAN_PASSWORT"

# Enable the fallback hotspot (captive portal) if the Wi-Fi connection fails
  ap:
    ssid: "Max7219-Esp32-Reg"
    # Choose a secure password
    password: "du bist Bereit"

# Enable the local web server on the device
web_server:
  port: 80

# Allow Bluetooth provisioning directly in the browser (e.g. Chrome)
esp32_improv:
  authorizer: none

# Start the fallback Wi-Fi network if the connection fails.
captive_portal: